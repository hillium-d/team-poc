name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: make install
      - run: make lint
      - run: make test
      - run: make build

# Production is not deployed from GitHub. The Team Lead releases it in
# Render with "Manual Deploy -> Deploy latest commit" (see render.yaml).
